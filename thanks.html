<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Gautam Travels India</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .thank-you-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5rem 1.5rem;
            min-height: 60vh;
        }
        .thank-you-section h1 {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            color: var(--heading);
            margin-bottom: 1rem;
        }
        .thank-you-section p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 2rem;
        }
        .btn-home {
            background-color: var(--primary);
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body class="theme-professional">
    <main>
        <section class="thank-you-section container">
            <h1>Thank You!</h1>
            <p>Your message has been sent successfully. We will get back to you shortly.</p>
            <a href="index.html" class="btn-home">Return to Home</a>
        </section>
    </main>
</body>
</html>
